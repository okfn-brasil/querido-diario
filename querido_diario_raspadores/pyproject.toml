[project]
name = "querido-diario-raspadores"
version = "1.0"
requires-python = ">=3.13"
dependencies = [
    # boto3/botocore/s3transfer pinados para casar com o awscli pré-instalado
    # na imagem de deploy do Scrapy Cloud (stack scrapy:2.14-20260326), que
    # traz awscli==1.40.10 (exige botocore==1.38.11 e s3transfer==0.12.0).
    # Uma versão diferente quebra o `pip check` do `shub deploy`.
    "boto3==1.38.11",
    "botocore==1.38.11",
    "s3transfer==0.12.0",
    "click",
    "chompjs",
    "dateparser",
    "filetype",
    "thefuzz",
    "itemadapter",
    "jinja2",
    "psycopg2-binary",
    "pyyaml==5.3.1",
    "python-dateutil",
    "python-decouple",
    "requests",
    "scrapy==2.14.2",
    "scrapy-zyte-smartproxy",
    "sqlalchemy",
    "spidermon",
    "w3lib",
    "querido-diario-toolbox",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "isort",
    "pre-commit",
    "pytest",
    # Mesma versão fornecida pela stack do Scrapy Cloud. Mantê-la no ambiente
    # de testes permite detectar incompatibilidades entre sh_scrapy e Scrapy.
    "scrapinghub-entrypoint-scrapy==0.18.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gazette*"]

[tool.setuptools.package-data]
gazette = ["resources/*.json", "resources/*.csv"]

[project.entry-points.scrapy]
settings = "gazette.settings"
