name: Run tests

on: [ push, pull_request ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
      - name: Check pre-commit hooks
        run: uvx pre-commit run --all

  data-collection-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: querido_diario_raspadores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run pytest
        run: uv run pytest tests/ -v
      - name: Check for dependency conflicts with the Scrapy Cloud deploy stack
        # A imagem de deploy do Scrapy Cloud (stack definida em scrapinghub.yml)
        # já vem com um awscli pré-instalado que exige versões exatas de
        # boto3/botocore/s3transfer. Se essas libs forem atualizadas sem
        # respeitar essa exigência, o `shub deploy` falha silenciosamente
        # (só se descobre no push para a main). Este passo reproduz o
        # `pip check` que o deploy faz, usando o awscli da stack atual.
        run: |
          uv export --no-hashes --no-dev --no-emit-project -o /tmp/requirements.txt
          uv venv /tmp/deploy-check
          uv pip install --python /tmp/deploy-check -r /tmp/requirements.txt
          uv pip install --python /tmp/deploy-check awscli==1.40.10
          uv pip check --python /tmp/deploy-check
