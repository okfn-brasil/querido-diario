name: Deploy to Scrapy Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        python-version: "3.13"
    - name: Generate requirements.txt for the Scrapy Cloud stack
      # scrapinghub.yml aponta pra requirements.txt (formato exigido pelo shub
      # deploy); o pyproject.toml/uv.lock são a fonte da verdade, então esse
      # arquivo é gerado aqui em vez de versionado no repositório.
      run: |
        cd querido_diario_raspadores/
        uv export --no-hashes --no-dev --no-emit-project -o requirements.txt
    - name: Deploy to Scrapy Cloud
      env:
        SHUB_APIKEY: ${{ secrets.SHUB_APIKEY }}
      run: |
        cd querido_diario_raspadores/
        uvx shub deploy ${{ secrets.SCRAPY_CLOUD_PROJECT_ID }}

    - name: Install project dependencies
      run: |
        cd querido_diario_raspadores/
        uv sync

    - name: Sync spiders to API
      env:
        QUERIDODIARIO_API_URL: ${{ secrets.QUERIDODIARIO_API_URL }}
        QUERIDODIARIO_API_KEY: ${{ secrets.QUERIDODIARIO_API_KEY }}
      run: |
        cd querido_diario_raspadores/
        uv run scrapy qd-sync-spiders
