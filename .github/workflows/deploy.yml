name: Deploy to Scrapy Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.13"
    - name: Install shub
      run: |
        python -m pip install --upgrade pip
        pip install shub
    - name: Deploy to Scrapy Cloud
      env:
        SHUB_APIKEY: ${{ secrets.SHUB_APIKEY }}
      run: |
        cd data_collection/
        shub deploy ${{ secrets.SCRAPY_CLOUD_PROJECT_ID }}

    - name: Install project dependencies
      run: |
        cd data_collection/
        pip install -r requirements.txt

    - name: Sync spiders to API
      env:
        QUERIDODIARIO_API_URL: ${{ secrets.QUERIDODIARIO_API_URL }}
        QUERIDODIARIO_API_KEY: ${{ secrets.QUERIDODIARIO_API_KEY }}
      run: |
        cd data_collection/
        scrapy qd-sync-spiders
